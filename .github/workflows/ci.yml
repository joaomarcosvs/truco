name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: mvn verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '21'
          cache: maven

      - name: Build, formatação e testes
        run: ./mvnw -B -ntp verify
